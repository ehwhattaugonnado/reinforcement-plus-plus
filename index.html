      THESIS: The whole app is the RBT's own trial data sheet, not a
      dashboard wrapped around one — behavior-analytic evidence lives on
      ruled paper, not KPI tiles.
      OWN-WORLD: Clipboard-tan ground, graphite ink, highlighter-yellow
      flag, ballpoint-blue active accent; ruled grid lines, tally boxes,
      stamped condition headers, checkbox states; IBM Plex Sans for UI
      text, IBM Plex Mono for tallies, timestamps, and the event log.
      STORY: A learner reads their own session as a sheet they're filling
      out live — every response a tally, every phase a stamped header,
      every reinforcer status a field left blank until evidence fills it in.
      FIRST VIEWPORT: Header as a condition strip (session/phase/schedule/
      elapsed); delivery target and creature scene inside a ruled trial
      box; session controls read as clipboard hardware.
      FORM: The Trial Data Sheet, IMPECCABLE'S PICK, candidate 1 of 7;
      seed key bd93f60c.

      with the finish review, the verdict, DESIGN.md, and every shipping
      raster carrying its provenance.
